[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "firebase-admin", "serverless-http", "vite"]

# Route the production image-analysis endpoint to its own lightweight function.
[[redirects]]
  from = "/api/analyze-defect"
  to = "/.netlify/functions/analyze-defect"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Keep production deployments sourced from the main branch configuration.
