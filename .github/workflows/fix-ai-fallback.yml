name: Fix AI fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-ai-fallback:
    if: ${{ !contains(github.event.head_commit.message, 'fix(ai-fallback)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch Gemini fallback and friendly errors
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api = Path('netlify/functions/api.ts')
          text = api.read_text()

          old = """/**
           * Keep the civic image analysis request bounded and predictable.
           * The previous implementation tried three models with two attempts each,
           * which could keep a Netlify request open long enough to hit an inactivity timeout.
           */
          async function generateGeminiContent(client: GoogleGenAI, contents: any[]) {
            return await client.models.generateContent({
              model: 'gemini-3.8-flash',
              contents,
              config: {
                thinkingConfig: {
                  thinkingLevel: 'low',
                },
              },
            });
          }
          """

          new = """/**
           * Use a fast, bounded model fallback chain. Gemini can temporarily return
           * 429/503/UNAVAILABLE during demand spikes, so a single-model request is not
           * reliable enough for a public civic reporting flow.
           */
          const GEMINI_MODELS = [
            'gemini-3.5-flash-lite',
            'gemini-3.8-flash',
            'gemini-3.7-flash',
            'gemini-3.6-flash',
          ];

          function isTransientGeminiError(error: any) {
            const message = String(error?.message || error || '').toLowerCase();
            const status = Number(error?.status || error?.code || 0);
            return (
              status === 429 || status === 500 || status === 502 || status === 503 || status === 504 ||
              message.includes('unavailable') || message.includes('high demand') ||
              message.includes('resource exhausted') || message.includes('temporarily') ||
              message.includes('timeout') || message.includes('timed out')
            );
          }

          function friendlyGeminiError(error: any) {
            const message = String(error?.message || error || '');
            if (/high demand|unavailable|resource exhausted|temporarily/i.test(message)) {
              return 'AI service is temporarily busy. Please try again in a few seconds.';
            }
            if (/timeout|timed out/i.test(message)) {
              return 'AI analysis took too long. Please try again with the same image.';
            }
            return 'AI analysis is temporarily unavailable. Please try again.';
          }

          async function generateGeminiContent(client: GoogleGenAI, contents: any[]) {
            let lastError: any = null;

            for (const model of GEMINI_MODELS) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 9000);

              try {
                return await client.models.generateContent({
                  model,
                  contents,
                  config: {
                    responseMimeType: 'application/json',
                    maxOutputTokens: 700,
                    abortSignal: controller.signal,
                  },
                });
              } catch (error: any) {
                lastError = error;
                console.warn(`Gemini model ${model} failed; trying fallback if transient.`, {
                  code: error?.code,
                  status: error?.status,
                  message: error?.message,
                });
                if (!isTransientGeminiError(error)) throw error;
              } finally {
                clearTimeout(timeout);
              }
            }

            const error = new Error(friendlyGeminiError(lastError));
            (error as any).code = 'AI_TEMPORARILY_UNAVAILABLE';
            (error as any).status = 503;
            throw error;
          }
          """

          if old not in text:
              raise SystemExit('Expected Gemini function block was not found; refusing to modify the file.')
          text = text.replace(old, new, 1)

          old_catch = """  } catch (error: any) {
            console.error('AI defect analysis failed:', { code: error?.code, status: error?.status, message: error?.message });
            return res.status(502).json({ success: false, error: error?.message || 'AI analysis failed. No complaint was submitted.' });
          }
          """
          new_catch = """  } catch (error: any) {
            console.error('AI defect analysis failed:', { code: error?.code, status: error?.status, message: error?.message });
            const status = Number(error?.status) === 503 ? 503 : 502;
            return res.status(status).json({ success: false, error: friendlyGeminiError(error) });
          }
          """
          if old_catch not in text:
              raise SystemExit('Expected defect-analysis catch block was not found; refusing to modify the file.')
          text = text.replace(old_catch, new_catch, 1)
          api.write_text(text)

          firebase = Path('src/lib/firebase.ts')
          ftext = firebase.read_text()
          old_auth = """    case 'auth/operation-not-allowed':
      return 'Email/password authentication is disabled in Firebase Authentication. Enable the Email/Password provider.';
"""
          new_auth = """    case 'auth/operation-not-allowed':
      return 'This sign-in method is disabled in Firebase Authentication. Enable the required provider in Firebase Console → Authentication → Sign-in method.';
"""
          if old_auth in ftext:
              ftext = ftext.replace(old_auth, new_auth, 1)
          firebase.write_text(ftext)
          PY

      - name: Commit fixes and remove migration workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add netlify/functions/api.ts src/lib/firebase.ts
          git rm .github/workflows/fix-ai-fallback.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(ai-fallback): handle Gemini demand spikes gracefully"
          git push
