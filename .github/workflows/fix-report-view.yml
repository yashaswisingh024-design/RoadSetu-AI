name: Fix report view

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-report-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply report view fixes
        if: ${{ !contains(github.event.head_commit.message, 'fix(report-view)') }}
        run: python3 scripts/fix_report_view.py

      - name: Remove migration script
        if: ${{ !contains(github.event.head_commit.message, 'fix(report-view)') }}
        run: rm scripts/fix_report_view.py

      - name: Commit and push fixes
        if: ${{ !contains(github.event.head_commit.message, 'fix(report-view)') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/ReportPotholeView.tsx scripts/fix_report_view.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(report-view): compress images and remove fake location fallback"
          git push
