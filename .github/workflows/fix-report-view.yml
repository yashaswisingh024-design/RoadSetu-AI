name: Fix report view

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-report-view:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Skip generated fix commit
        if: ${{ contains(github.event.head_commit.message, 'fix(report-view)') }}
        run: echo "Report view fix already applied; skipping."

      - name: Apply report view fixes
        if: ${{ !contains(github.event.head_commit.message, 'fix(report-view)') }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/views/ReportPotholeView.tsx')
          text = path.read_text()

          text = text.replace(
              """      latitude: 19.2312,\n      longitude: 72.9765,""",
              """      latitude: 0,\n      longitude: 0,"""
          )

          old = re.compile(r"""      } else {\n        if \(active\) {\n          if \(res\.isIframeBlocked\) {\n            setIsIframeBlocked\(true\);\n          }\n\n          setHumanLocation\(\{\n            road: 'Ghodbunder Road \(SH-42\)',\n            area: 'Manpada Sector 4',\n            landmark: 'Near Manpada Junction',\n            city: 'Thane',\n            state: 'Maharashtra',\n            country: 'India',\n            formattedAddress:\n              'Ghodbunder Road, Near Manpada Junction, Thane, Maharashtra',\n            latitude: 19\.2312,\n            longitude: 72\.9765,\n          \}\);\n\n          setLocationSuccessText\(\n            'Corridor default set'\n          \);\n        }\n      }""")

          replacement = """      } else {\n        if (active) {\n          if (res.isIframeBlocked) {\n            setIsIframeBlocked(true);\n          }\n\n          setLocationError(\n            res.errorMessage ||\n              'Live location could not be detected. Please use Search location or Enter manually.'\n          );\n\n          setLocationSuccessText(\n            'Location required'\n          );\n        }\n      }"""

          text, count = old.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 GPS fallback, found {count}')

          text = text.replace(
              """                        latitude:\n                          humanLocation.latitude ||\n                          19.2312,\n                        longitude:\n                          humanLocation.longitude ||\n                          72.9765,""",
              """                        latitude: 0,\n                        longitude: 0,"""
          )

          marker = "  /* ---------------- UPLOAD ---------------- */\n"
          helper = r'''  /* ---------------- IMAGE COMPRESSION ---------------- */

  const compressImage = (
    dataUrl: string,
    maxWidth = 1280,
    quality = 0.75
  ): Promise<string> => {
    return new Promise((resolve, reject) => {
      const image = new Image();

      image.onload = () => {
        const scale = Math.min(1, maxWidth / image.width);
        const canvas = document.createElement('canvas');

        canvas.width = Math.max(1, Math.round(image.width * scale));
        canvas.height = Math.max(1, Math.round(image.height * scale));

        const context = canvas.getContext('2d');

        if (!context) {
          reject(new Error('Unable to prepare image for upload.'));
          return;
        }

        context.drawImage(
          image,
          0,
          0,
          canvas.width,
          canvas.height
        );

        resolve(canvas.toDataURL('image/jpeg', quality));
      };

      image.onerror = () =>
        reject(new Error('Unable to read the selected image.'));

      image.src = dataUrl;
    });
  };

'''
          if marker not in text:
              raise SystemExit('Upload marker not found')
          if 'const compressImage = (' not in text:
              text = text.replace(marker, helper + marker, 1)

          old_handler = re.compile(r"""  const handleFileUpload = \(\n    e: React\.ChangeEvent<HTMLInputElement>\n  \) => \{.*?    reader\.readAsDataURL\(file\);\n  \};""", re.S)
          new_handler = r'''  const handleFileUpload = async (
    e: React.ChangeEvent<HTMLInputElement>
  ) => {
    const file = e.target.files?.[0];

    if (!file) return;

    if (!file.type.startsWith('image/')) {
      showToast(
        'Please select a valid image file.',
        'error'
      );
      return;
    }

    const reader = new FileReader();

    reader.onload = async () => {
      try {
        const result = reader.result as string;
        const compressed = await compressImage(result);

        setPhotoUrl(compressed);
        setBase64Image(compressed);

        showToast(
          'Photo compressed and loaded successfully.',
          'success'
        );
      } catch {
        showToast(
          'Unable to process this image. Please try another photo.',
          'error'
        );
      }
    };

    reader.onerror = () => {
      showToast(
        'Unable to read the selected image.',
        'error'
      );
    };

    reader.readAsDataURL(file);
  };'''
          text, count = old_handler.subn(new_handler, text)
          if count != 1:
              raise SystemExit(f'Expected exactly 1 upload handler, found {count}')

          needle = """  const runAiAnalysisAndSubmit = async (\n    overrideDuplicate = false\n  ) => {\n"""
          guard = """  const runAiAnalysisAndSubmit = async (\n    overrideDuplicate = false\n  ) => {\n    const hasRealCoordinates =\n      Number.isFinite(humanLocation.latitude) &&\n      Number.isFinite(humanLocation.longitude) &&\n      (humanLocation.latitude !== 0 ||\n        humanLocation.longitude !== 0);\n\n    if (!hasRealCoordinates) {\n      setCurrentStep(2);\n      setLocationError(\n        'A real location is required before submitting. Use GPS, Search location, or Enter manually.'\n      );\n      showToast(\n        'Please confirm the defect location before submitting.',\n        'error'\n      );\n      return;\n    }\n\n"""
          if needle not in text:
              raise SystemExit('AI submission function marker not found')
          text = text.replace(needle, guard, 1)

          path.write_text(text)

          final = path.read_text()
          for forbidden in [
              'Ghodbunder Road',
              'Manpada Sector 4',
              '19.2312',
              '72.9765',
              "setPhotoUrl(result);\n      setBase64Image(result);",
          ]:
              if forbidden in final:
                  raise SystemExit(f'Forbidden legacy content remains: {forbidden}')

          if 'const compressImage = (' not in final:
              raise SystemExit('Compression helper was not added')
          PY

      - name: Commit and push
        if: ${{ !contains(github.event.head_commit.message, 'fix(report-view)') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/views/ReportPotholeView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(report-view): compress images and remove fake location fallback"
          git push
